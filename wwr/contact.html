<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Down the River Rafting Company</title>
    <meta name="description" content="Contact Us Page of the Down the River Rafting Company Site.">
    <meta name="author" content="Buyannemekh Chimeddorj">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-downriver.png" alt="Down the River Rafting Company Logo" width=125>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="address">
            <div class="address-content">
                <h2>"Down the River" Rafting Company</h2>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>Ph: +1 999 999 9999</p>
                <p>info@downtheriver.com</p>
            </div>
        </section>

        <section class="contact">

            <!-- LEFT: Google Map -->
            <div class="contact-map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d521.3650868261208!2d106.93449806392071!3d47.92002385992986!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2smn!4v1776059312805!5m2!1sen!2smn"
                  width="500" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <!-- RIGHT: Contact Form -->
            <div class="contact-form">
                <h2>Contact Us</h2>

                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" required>

                    <p><strong>Message Purpose:</strong></p>

                    <label>
                        <input type="radio" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                    <label for="message"><strong>Message</strong></label>
                    <textarea id="message" rows="5" required></textarea>

                    <label class="checkbox-label">
                        <input type="checkbox" id="newsletter" name="newsletter">Please,
                        subscribe me to the monthly newsletter
                    </label>

                    <button type="submit" class="btn">Get In Touch</button>
                </form>
            </div>

        </section>


        <section class="employee">
            <h2>We Are Here to Serve You!</h2>

            <div class="employee-gallery">
                <figure>
                    <img src="images/employee-1.png" alt="Employee 1">
                    <figcaption>José Martínez</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-2.png" alt="Employee 2">
                    <figcaption>María González</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-3.png" alt="Employee 3">
                    <figcaption>Carlos Rodríguez</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 "Down the River" Rafting Company | Buyannemekh Chimeddorj</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/buyannemekh.chimeddorj"> <img
                  src="images/facebook.svg" alt="Facebook Icon"></a>
            <a href="https://www.linkedin.com/in/buyannemekh-chimeddorj"> <img
                  src="images/linkedin.svg" alt="LinkedIn Icon"></a>
            <a href="https://www.instagram.com/buyannemekhchimeddorj"> <img
                  src="images/instagram.svg" alt="Instagram
                  Icon"></a>
        </nav>
    </footer>
</body>

</html>
